title = "openbox-sdk-ts gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Generated artifacts, lockfiles, and placeholder values that are not real secrets"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)coverage/''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)\.env\.example$''',
  # Fixture-only RSA keypair for the v2 agent-identity golden fixtures. Owned by
  # openbox-core/testdata/identity-v2 and synced here. Allowlisted by exact path so no
  # global rule has to be loosened; the keypair carries an explicit non-production warning.
  '''(^|/)test/fixtures/identity-v2/keypair\.json$''',
]
